<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>7-Day Forecast - CeruSky</title>
	<link rel="icon" href="../images/cerusky-logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Jura:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/leftpanel.css">
    <link rel="stylesheet" href="css/content.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <!-- The icons this page uses. The full set is in index.html. -->
    <svg class="IconSprite" aria-hidden="true">
        <symbol id="icon-wind" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/></symbol>
        <symbol id="icon-droplet" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7Z"/></symbol>
        <symbol id="icon-sunrise" viewBox="0 0 24 24"><path d="M8 18a4 4 0 0 1 8 0Z" fill="#F6C85F" stroke="#F6C85F" stroke-width="1.5"/><path d="M12 8v2M4.93 10.93l1.41 1.41M19.07 10.93l-1.41 1.41M2 18h2M20 18h2M2 22h20" stroke="#F6C85F" stroke-width="1.5"/></symbol>
    </svg>

    <aside class="LeftPanel">
        <div class="CeruBox">
            <a class="CeruContainer" href="index.html" aria-label="CeruSky home">
                <img class="logo" src="../images/cerusky-logo.svg" alt="">
                <span class="span">CeruSky</span>
            </a>
        </div>

        <div class="UnitRow">
            <span class="UnitLabel" id="unit-label">Temperature</span>
            <div class="UnitToggle" role="group" aria-labelledby="unit-label">
                <button type="button" class="UnitActive" data-unit="F" aria-pressed="true">°F</button>
                <button type="button" data-unit="C" aria-pressed="false">°C</button>
            </div>
        </div>

        <div class="PanelSpace">
            <!-- site.js fills in the buttons for each page -->
            <nav class="PageNav" aria-label="Pages">
                <ul class="PageLinks" id="page-links"></ul>
            </nav>

            <div class="PanelTagline">
                <svg class="Icon"><use href="#icon-sunrise"/></svg>
                <p class="TaglineMain">A little clarity for your everyday.</p>
                <p class="TaglineSub">See what's in your sky.</p>
            </div>
        </div>
    </aside>

    <div class="create">
        <main class="content">

            <div class="PageHeading">
                <div>
                    <h1 id="week-title">7-Day Forecast</h1>
                    <p class="Muted" id="week-place">Finding your location...</p>
                </div>
            </div>

            <section class="Card WeekCard" aria-labelledby="week-title">
                <!-- forecastpage.js fills in one row per day -->
                <ul class="WeekList" id="week-list">
                    <li class="Muted">Loading the forecast...</li>
                </ul>
                <p class="DataSource">Forecast data: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> (CC BY 4.0)</p>
            </section>

        </main>

        <footer class="SiteFooter">
            Forecast data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>.
            <a href="about.html">All credits</a>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="site.js"></script>
    <script src="units.js"></script>
    <script src="forecastpage.js"></script>
</body>
</html>
